name: CI

on:
  # `develop` too: feature PRs land there, and a release PR into `main` used to
  # be the first time a milestone's changes ever ran in CI.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check

      - name: Type-check (pyright)
        run: poetry run pyright

      - name: Test (pytest)
        run: poetry run pytest -q

      # Also asserted by tests/test_loc_budget.py, so it fails while you are
      # writing the code. Repeated here because the table it prints is the
      # actionable part, and a `-q` pytest run swallows it.
      - name: Size budget (core harness)
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.11' }}
        run: poetry run python scripts/loc.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Wheel smoke test
        run: python scripts/smoke_wheel.py
