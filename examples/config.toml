# midge configuration. Copy to `.midge/config.toml` in a project, or to
# `~/.midge/config.toml` for every project.
#
# Both are read, project first, and merged key by key — so a project file that
# sets `model` does not discard your personal `[log] level`.
#
# Precedence, highest first:
#
#     command-line flag  >  environment variable  >  this file  >  the default
#
# Every key below is optional and shown with its default. An unrecognized key is
# reported at startup as `config_key_unknown` rather than ignored, so a typo is
# visible.

# The model id sent to the provider. Env: MIDGE_MODEL
model = "gpt-4o-mini"


[provider]
# Which wire format to speak: "openai" or "openai-compatible". Omit to infer —
# no base_url means OpenAI, a base_url means something OpenAI-compatible
# (ollama, vLLM, LM Studio, llama.cpp). Env: MIDGE_PROVIDER
# name = "openai-compatible"

# Where to send requests. Omit for the provider's own default.
# Env: OPENAI_BASE_URL
#
# NOTE: a base_url can carry credentials in its userinfo
# (https://user:password@host/v1). midge only ever logs its hostname, but a
# config file gets committed — prefer the environment variable if yours has a
# secret in it.
# base_url = "http://localhost:11434/v1"

# Ask the server to report token usage on the stream. Omit to use whatever the
# provider declares (currently on for both). Set false for a server that
# rejects `stream_options` with a 400 instead of ignoring it — that failure
# takes down the whole turn. Env: MIDGE_INCLUDE_USAGE
# include_usage = true


# --- the model registry ----------------------------------------------------
#
# Optional, and empty by default. What it buys you is more than one service at
# once: with a registry, the model determines where the request goes, so
# `set_model` and a sub-agent's `model=` route correctly instead of all landing
# on whatever `[provider]` above happens to name.
#
# THE ASYMMETRY WORTH KNOWING: an empty registry is permissive — any model
# string is accepted. Writing even one `[models."..."]` entry turns enforcement
# on, and from then on a model you have not listed is refused. That is the point
# — you are declaring what you want available.
#
# midge ships no list of models and never will: vendors add and retire them
# continuously, so any list baked into the tool is wrong within weeks. It also
# does not check that a model id exists — a typo fails at the API with the
# vendor's own error, which is more accurate than a guess from here. What it
# does check is the wiring: a model naming a provider you never defined is
# dropped, and says so at startup.
#
# `[providers.*]` says how to reach a service. The name is yours.
# `[models.*]` says which service a model lives on.

# [providers.openai]
# kind = "openai"                    # which wire format; see `midge.providers`
# api_key_env = "OPENAI_API_KEY"     # the NAME of the variable, never the key

# [providers.local]
# kind = "openai-compatible"
# base_url = "http://localhost:11434/v1"
# include_usage = false              # per-provider; overrides what the adapter declares

# [models."gpt-4o-mini"]
# provider = "openai"

# [models."ibm/granite-3.2-8b"]
# provider = "local"

# The top-level `model` above selects which of these to start with, so with a
# registry it has to name one of them. There is no separate default here — one
# setting, one spelling.


[profiles]
# The profile to start under, by name. A profile is a named bundle of system
# prompt, model, tool subset and active hooks, declared as a `Profile` instance
# in an extension `.py` file and discovered through `--extension-dir` — there is
# no separate profile directory. See `examples/profile_extension/`.
#
# Omit to start under no profile, which is what midge has always done. A name
# that matches no discovered profile is refused at startup rather than ignored.
# Flag: --profile   Env: MIDGE_PROFILE
# default = "adversarial-reviewer"

# What `use_profile(..., resume_last)` does when the named profile has no prior
# transcript in this session — "fork" or "continue". That is an ordinary first
# use of a profile rather than an error, so the switch still succeeds and the
# response says which happened.
#
# "fork" because a caller reaching for `resume_last` is working
# thread-per-profile, and forking is that model's first-run behaviour;
# "continue" would silently merge two threads the option exists to keep apart.
resume_fallback = "fork"


[session]
# Every run records a JSONL transcript. Set false to record nothing, or pass
# `--no-session` for one run. An explicit `--session PATH` is honoured either
# way — naming a file is a deliberate request, not a default.
# Env: MIDGE_SESSION
enabled = true

# Where transcripts go. Omit for `.midge/sessions` under the working directory,
# which `.gitignore` already covers. Without `--session`, a timestamped file is
# created here; a *relative* `--session run.jsonl` also lands here rather than
# in the working directory, so transcripts stay one collection. Pass an
# absolute path to write somewhere else. `~` is expanded.
# Env: MIDGE_SESSION_DIR
# dir = "~/.midge/sessions"


[subagents]
# What an operator owns. Prompt, tools and model are declared per agent in the
# `.py` file — see `examples/subagent_extension/`.

# How many nested agents may run at once.
max_concurrent = 4

# The budget for an agent that declares no `timeout` of its own, in seconds.
timeout = 300.0

# The hard ceiling, in seconds. An author sets a budget per agent and a
# `spawn_*` tool may offer the *caller* a `timeout` for a job that needs longer,
# but nothing gets past this. A delegation that never returns is worth bounding
# unconditionally.
max_timeout = 900.0

# There is deliberately no `max_depth`. Whether a sub-agent may spawn another is
# decided by its own `tools` allowlist, in its own file — a global cap would
# only override that. Recursion with no end is denied precisely instead: a child
# never gets a spawn tool for an agent already running above it, so a cycle is
# refused exactly where it would close and the same declaration works anywhere
# else. A cyclic allowlist is reported at startup as the bug it is, but costs
# you nothing.


[retry]
# How many times a request may be attempted in total, and the base for the
# exponential backoff between attempts, in seconds. Only errors the provider
# classifies as retryable — rate limits, 5xx, transport faults — are retried,
# and never once any content has already been streamed to the caller.
#
# The backoff is jittered: the wait is a random point in `[0, base * 2**n]`
# rather than the endpoint. Concurrent sub-agents share one client, so a
# deterministic delay would have them all wake at the same instant and collide
# on the limit they were backing off from.
max_attempts = 3
base_delay = 0.5

# A ceiling on any single wait, in seconds. When a 429 carries `Retry-After`
# that hint is honoured instead of the backoff — the server knows when the
# window resets and we do not — but it is capped here, so a server asking for
# an hour cannot park a turn for one.
max_delay = 60.0


[compaction]
# Summarize history after a turn once its estimated tokens exceed this.
# Omit to disable. Flag: --compaction-threshold
# threshold = 120000

# Token budget for the recent suffix kept verbatim when compaction runs.
# Flag: --compaction-keep-recent
keep_recent = 20000


[log]
# Level for midge's own loggers. Env: MIDGE_LOG_LEVEL
level = "WARNING"

# Level for the `openai` SDK, pinned separately on purpose: its DEBUG output can
# carry the Authorization header. Env: MIDGE_LOG_LEVEL_OPENAI
openai_level = "WARNING"

# Write logs here instead of stderr. `~` is expanded. This is the practical way
# to read logs under the TUI, which otherwise routes them to Textual's devtools
# console. Env: MIDGE_LOG_FILE
# file = "~/.midge/midge.log"

# Truncation cap for DEBUG payloads (request bodies, tool arguments and
# results). 0 disables truncation. Env: MIDGE_LOG_PAYLOAD_CHARS
payload_chars = 2000


# There is deliberately no api_key here. Credentials stay in OPENAI_API_KEY, in
# the environment — a config file gets committed, and midge never logs the key at
# any level. Putting `api_key` in this file is reported as an unknown key and has
# no effect.
