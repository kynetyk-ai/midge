[project]
name = "midge"
version = "0.1.0"
description = "Hackable Python agent harness — readable, retargetable, ~2k LOC."
authors = [{ name = "Joshua Ziel", email = "josh@kynetyk.ai" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "openai>=1.50.0,<2.0.0",
    "pydantic>=2.13.4,<3.0",
    "textual>=8.2.8,<9.0.0",
    "pyyaml (>=6.0.3,<7.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
]

[project.scripts]
midge = "midge.cli:main"

[tool.poetry]
packages = [{ include = "midge", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
ruff = "^0.16"
pyright = "^1.1.411"
types-pyyaml = "^6.0.12.20260724"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "G", "LOG"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
